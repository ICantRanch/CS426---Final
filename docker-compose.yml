version: '3.9'
services:
  client:
    build: client
    ports:
      - '3000:3000'
    volumes:
      - ./client:/usr/app
      - /usr/app/build
      - /usr/app/node_modules
  cards:
    build: cards
    ports:
      - '5000:5000'
    volumes:
      - ./cards:/usr/app
      - /usr/app/node_modules
  scores:
    build: scores
    ports:
      - '5004:5004'
    volumes:
      - ./scores:/usr/app
      - /usr/app/node_modules
  event-bus:
    build: event-bus
    volumes:
      - ./event-bus:/usr/app
      - /usr/app/node_modules
  translator:
    build: translator
    ports:
      - '5001:5001'
    volumes:
      - ./translator:/usr/app
      - /usr/app/node_modules
  query:
    build: query
    ports:
      - '5002:5002'
    volumes:
      - ./query:/usr/app
      - /usr/app/node_modules
  atlas-db:
    build: database
    volumes:
      - mongodb-data:/data/db
    ports:
      - 27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secret

volumes:
  mongodb-data:

